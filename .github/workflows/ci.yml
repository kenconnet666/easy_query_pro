name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hana:
        description: Run HANA adapter contracts against a configured test instance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Java 17 / ${{ matrix.os }}
    concurrency:
      group: ci-${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          cache: maven
      - name: Build and run SQL contracts
        shell: bash
        run: ./mvnw --batch-mode clean verify
      - name: Preserve build outputs and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ matrix.os }}
          path: |
            easy-query-pro-*/target/*.jar
            integration-tests/target/surefire-reports/
          retention-days: 7

  consumers:
    name: Artifact consumer / ${{ matrix.os }}
    concurrency:
      group: ci-${{ github.workflow }}-consumers-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          cache: maven
      - name: Build isolated JAR and APT consumers
        shell: bash
        run: ./mvnw --batch-mode clean verify -Pconsumers,artifacts -pl consumer-tests -am
      - name: Preserve independent build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifact-consumer-${{ matrix.os }}
          path: |
            pom.xml
            easy-query-pro-*/pom.xml
            easy-query-pro-*/target/*.jar
            consumer-tests/target/invoker-reports/
            consumer-tests/target/projects/**/build.log
            consumer-tests/target/projects/**/target/surefire-reports/
          retention-days: 7

  databases:
    name: Database / ${{ matrix.database }}
    concurrency:
      group: ci-${{ github.workflow }}-database-${{ github.ref }}-${{ matrix.database }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: eqp-ci-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: infra/compose.yaml
      COMPOSE_PROFILES: ${{ matrix.database }}
      TEST_DATABASE: ${{ matrix.database }}
      EQP_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:53306/eqp?sslMode=DISABLED&allowPublicKeyRetrieval=true
      EQP_MYSQL_USER: eqp
      EQP_PG_JDBC_URL: jdbc:postgresql://127.0.0.1:55432/eqp
      EQP_PG_USER: eqp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          cache: maven
      - name: Generate temporary database credentials
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          {
            echo "EQP_DB_PASSWORD=$password"
            echo "EQP_MYSQL_PASSWORD=$password"
            echo "EQP_PG_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Start databases with memory limits
        run: |
          docker compose up --detach --wait --wait-timeout 120
          expected=1073741824
          if [ "$TEST_DATABASE" = mysql ]; then expected=2147483648; fi
          container=$(docker compose ps -q "$TEST_DATABASE")
          docker inspect "$container" | jq -e --argjson expected "$expected" \
            '.[0].HostConfig | .Memory == $expected and .MemorySwap == $expected'
      - name: Run JDBC contracts
        run: ./mvnw --batch-mode clean verify "-P$TEST_DATABASE"
      - name: Verify the packaged Java client against the same database
        run: ./mvnw --batch-mode verify -Pconsumers -pl consumer-tests -am "-Dconsumer.database=$TEST_DATABASE"
      - name: Collect database logs on failure
        if: failure()
        run: |
          mkdir -p target
          docker compose logs --no-color > target/database-containers.log
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: database-reports-${{ matrix.database }}
          path: |
            integration-tests/target/surefire-reports/
            integration-tests/target/failsafe-reports/
            consumer-tests/target/invoker-reports/
            consumer-tests/target/projects/**/build.log
            consumer-tests/target/projects/**/target/surefire-reports/
            target/database-containers.log
          retention-days: 7
      - name: Remove test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  hana-docker:
    name: HANA Docker / adapter
    concurrency:
      # Keep the active HANA run; the default single pending slot retains the newest candidate.
      group: ci-${{ github.workflow }}-hana-docker-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: eqp-hana-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: infra/hana.compose.yaml
      EQP_HANA_JDBC_URL: jdbc:sap://127.0.0.1:39041
      EQP_HANA_USER: SYSTEM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          cache: maven
      - name: Prepare the dedicated HANA runner
        run: |
          available_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          test "$available_kib" -ge 14000000
          sudo sysctl -w fs.aio-max-nr=262144 vm.max_map_count=135217728 vm.memory_failure_early_kill=1
          password="E9a$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "EQP_HANA_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start HANA with a 12 GiB limit
        run: |
          docker compose up --detach --wait --wait-timeout 900
          container=$(docker compose ps -q hana)
          docker inspect "$container" | jq -e \
            '.[0].HostConfig | .Memory == 12884901888 and .MemorySwap == 12884901888'
          docker exec "$container" /bin/bash /eqp/enable-hdi.sh
      - name: Verify HANA adapter and HDI contracts
        run: ./mvnw --batch-mode clean verify -Phana
      - name: Verify the packaged Java client against HANA
        run: ./mvnw --batch-mode verify -Pconsumers -pl consumer-tests -am -Dconsumer.database=hana
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts-orm/package.json
          cache: true
          cache_dependency_path: ts-orm/pnpm-lock.yaml
      - name: Verify TypeScript HANA query and transaction contracts
        working-directory: ts-orm
        env:
          EQTS_HANA_TEST: '1'
        run: |
          pnpm install --frozen-lockfile
          export EQTS_HANA_PASSWORD="$EQP_HANA_PASSWORD"
          pnpm test:integration
      - name: Collect HANA logs on failure
        if: failure()
        run: |
          mkdir -p target
          docker compose logs --no-color > target/hana-container.log
      - name: Preserve HANA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hana-docker-reports
          path: |
            integration-tests/target/failsafe-reports/
            consumer-tests/target/invoker-reports/
            consumer-tests/target/projects/**/build.log
            consumer-tests/target/projects/**/target/surefire-reports/
            target/hana-container.log
          retention-days: 7
      - name: Remove HANA test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  hana:
    name: Optional external HANA
    concurrency:
      # All refs share the same external environment.
      group: hana-external-hana-test
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.hana
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hana-test
    env:
      EQP_HANA_JDBC_URL: ${{ secrets.EQP_HANA_JDBC_URL }}
      EQP_HANA_USER: ${{ secrets.EQP_HANA_USER }}
      EQP_HANA_PASSWORD: ${{ secrets.EQP_HANA_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          cache: maven
      - name: Check HANA configuration
        run: |
          : "${EQP_HANA_JDBC_URL:?Configure the hana-test environment}"
          : "${EQP_HANA_USER:?Configure the hana-test environment}"
          : "${EQP_HANA_PASSWORD:?Configure the hana-test environment}"
      - name: Verify HANA adapter and HDI contracts
        run: ./mvnw --batch-mode clean verify -Phana
      - name: Preserve HANA reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hana-reports
          path: integration-tests/target/failsafe-reports/
          retention-days: 7

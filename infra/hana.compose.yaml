services:
  hana:
    image: saplabs/hanaexpress:2.00.088.00.20251110.1@sha256:432be2785506e97cefc413f495393fc22fcdda034c2c80db2f0f88efeb16dfaf
    platform: linux/amd64
    hostname: hxehost
    mem_limit: 12g
    memswap_limit: 12g
    mem_reservation: 8g
    cpus: 4.0
    pids_limit: 4096
    shm_size: 2g
    stop_grace_period: 2m
    environment:
      EQP_HANA_PASSWORD: ${EQP_HANA_PASSWORD:?Set EQP_HANA_PASSWORD in the environment}
    ports:
      - "127.0.0.1:${EQP_HANA_PORT:-39017}:39017"
    volumes:
      - hana-data:/hana/mounts
      - ./hana/start.sh:/eqp/start.sh:ro
    tmpfs:
      - /run/eqp:size=1m,mode=0700,uid=12000,gid=79
    entrypoint: [/bin/bash, /eqp/start.sh]
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      kernel.shmmax: 1073741824
      kernel.shmmni: 32768
      kernel.shmall: 8388608
      net.ipv4.ip_local_port_range: "40000 60999"
    healthcheck:
      test: [CMD-SHELL, 'test ! -e /run/eqp/password.json && bash -c "exec 3<>/dev/tcp/127.0.0.1/39017"']
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 2m
volumes:
  hana-data:
